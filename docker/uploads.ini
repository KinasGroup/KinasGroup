; KINAS GROUP — upload limit overrides
;
; PHP's compiled-in defaults (upload_max_filesize=2M, post_max_size=8M) were
; never overridden anywhere in this project, meaning even a normal photo
; from a phone camera (commonly 3-5MB) could silently fail to upload before
; the application's own 10MB check ever ran. Raised here to comfortably
; cover both regular listing photos and the virtual tour video upload
; (150MB app-level cap — post_max_size must exceed that, since it covers
; the whole multipart request body, not just one file).

upload_max_filesize = 160M
post_max_size = 165M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
