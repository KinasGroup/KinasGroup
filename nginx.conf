server {
    listen 8080;
    root /var/www/html;
    index index.php;

    # Default is 1MB, which silently rejects (413) almost any real photo
    # from a phone camera, let alone the virtual tour video upload. Applies
    # to every request, not just uploads, so it's set once here rather than
    # per-location.
    client_max_body_size 160M;

    # Block all hidden files and directories
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block sensitive file types
    location ~* \.(env|sql|sh|log|bak|orig|save)$ {
        deny all;
        return 404;
    }

    # Standard PHP routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # A 150MB video upload (read, validated, then forwarded to R2) can
        # take well past nginx's 60s default before PHP-FPM responds.
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
