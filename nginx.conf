server {
    listen 8080;
    root /var/www/html;
    index index.php;

    # Block all hidden files and directories (e.g. .env, .git)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block sensitive file types
    location ~* \.(env|sql|sh|log|bak|orig|save)$ {
        deny all;
        return 404;
    }

    # Block diagnostic/test scripts from public access
    location ~ ^/(service-tester|debug_error|test|standalone_test|railway_diagnose|simple_login|test-email|test-services|final_fix)\.(php)$ {
        deny all;
        return 404;
    }

    # Block direct access to database/ directory
    location ^~ /database/ {
        deny all;
        return 404;
    }

    # Block uploads/kyc-documents from direct access
    location ^~ /api/uploads/kyc-documents/ {
        deny all;
        return 403;
    }

    # Standard PHP routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Security headers
        fastcgi_hide_header X-Powered-By;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
